name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_flag: --linux
          - os: windows-latest
            platform_flag: --win
          - os: macos-latest
            platform_flag: --mac

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Package and publish (${{ matrix.os }})
        run: npx electron-builder ${{ matrix.platform_flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple/Windows signing certs are configured, so make sure
          # electron-builder doesn't go hunting for a local signing identity
          # and fail the build over it — ship unsigned artifacts.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tattoowarp-${{ matrix.os }}
          path: |
            app/release/*.AppImage
            app/release/*.exe
            app/release/*.dmg
            app/release/*.zip
          if-no-files-found: warn
